# PR Reviewer Web App. Fill in .env (see docs/web-app.md), then: docker compose up -d
services:
  web:
    build: .
    image: pr-reviewer-web
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      PR_REVIEWER_DATA_DIR: /data
    volumes:
      - pr-reviewer-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
  # The GitHub App (docs/github-app.md): docker compose --profile app up -d
  app:
    profiles: [app]
    build: .
    image: pr-reviewer-web
    command: ["node", "packages/cli/bin/pr-reviewer.js", "app"]
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env.app
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
volumes:
  pr-reviewer-data:
